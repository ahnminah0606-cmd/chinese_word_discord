name: Send daily Chinese sentence

on:
  push:
    branches:
      - main
  schedule:
    # Delivery window: 18:05-19:05 Asia/Seoul (UTC+9)
    # Multiple off-peak checks reduce the impact of GitHub Actions delays.
    - cron: "5,25,45 9 * * *"
    - cron: "5 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-chinese-discord
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name != 'push' || github.event.head_commit.message == 'Trigger September 17 lesson'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure secrets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL"
          test -n "$OPENAI_API_KEY"
          printf 'DISCORD_WEBHOOK_URL=%s\n' "$DISCORD_WEBHOOK_URL" > chinese_word_discord.env
          printf 'OPENAI_API_KEY=%s\nOPENAI_MODEL=gpt-5-mini\n' "$OPENAI_API_KEY" > chinese_word_discord_openai.env
          chmod 600 chinese_word_discord.env chinese_word_discord_openai.env

      - name: Send September 17 lesson
        if: github.event_name == 'push'
        env:
          TARGET_DATE: "2026-09-17"
        run: python3 chinese_word_discord.py

      - name: Send regular daily lesson
        if: github.event_name != 'push'
        run: python3 chinese_word_discord.py

      - name: Save lesson history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chinese_word_discord_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Chinese lesson history"
          git pull --rebase origin main
          git push
